<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GP & Margin Calculator</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 640'%3E%3Cpath fill='%230f6e7c' d='M128 252.6C128 148.4 214 64 320 64C426 64 512 148.4 512 252.6C512 371.9 391.8 514.9 341.6 569.4C329.8 582.2 310.1 582.2 298.3 569.4C248.1 514.9 127.9 371.9 127.9 252.6zM320 320C355.3 320 384 291.3 384 256C384 220.7 355.3 192 320 192C284.7 192 256 220.7 256 256C256 291.3 284.7 320 320 320z'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eaf1f4;--card:#fff;--ink:#12303f;--mute:#5a7381;--line:#cddbe2;--accent:#0f6e7c;--accent-ink:#fff;--bad:#b3261e;--good:#17714a;--field:#f6fafb;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1b22;--card:#152832;--ink:#e3eef2;--mute:#8fa9b5;--line:#27414e;--accent:#4fc3d4;--accent-ink:#06222a;--bad:#ff8a80;--good:#6fd6a3;--field:#0f212a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1b22;--card:#152832;--ink:#e3eef2;--mute:#8fa9b5;--line:#27414e;--accent:#4fc3d4;--accent-ink:#06222a;--bad:#ff8a80;--good:#6fd6a3;--field:#0f212a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
main{max-width:760px;margin:0 auto;padding:28px 16px 48px}
h1{font-size:1.75rem;margin:0 0 4px;letter-spacing:-.01em}
.sub{color:var(--mute);margin:0 0 22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:18px}
h2{font-size:1.05rem;margin:0 0 12px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.tabs button{font:inherit;font-weight:600;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--field);color:var(--ink);cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
label{display:block;font-size:.85rem;color:var(--mute);margin-bottom:4px}
input{width:100%;font:inherit;font-variant-numeric:tabular-nums;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--field);color:var(--ink)}
.out{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:18px}
.out div{border-left:3px solid var(--accent);padding:2px 0 2px 12px}
.out span{display:block;font-size:.85rem;color:var(--mute)}
.out b{font-size:1.6rem;font-variant-numeric:tabular-nums}
.neg{color:var(--bad)}
.msg{color:var(--bad);margin:12px 0 0;min-height:1.2em;font-size:.9rem}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:520px;font-variant-numeric:tabular-nums}
th{text-align:left;font-size:.85rem;color:var(--mute);font-weight:600;padding:6px 6px}
td{padding:4px 6px;border-top:1px solid var(--line)}
td input{padding:7px 8px}
td.r{text-align:right;white-space:nowrap}
.x{font:inherit;border:0;background:none;color:var(--mute);cursor:pointer;font-size:1.2rem;padding:4px 8px}
.add{font:inherit;font-weight:600;margin-top:12px;padding:8px 14px;border-radius:10px;border:1px solid var(--accent);background:none;color:var(--accent);cursor:pointer}
.note{color:var(--mute);font-size:.88rem;margin:14px 0 0}
</style>
</head>
<body>
<main>
<h1>GP & margin calculator</h1>
<p class="sub">Work out gross profit, margin and markup, or find the selling price you need.</p>

<section class="card">
<div class="tabs" role="group" aria-label="Calculation type">
<button data-m="price" aria-pressed="true">Cost + price</button>
<button data-m="margin" aria-pressed="false">Cost + target margin</button>
<button data-m="markup" aria-pressed="false">Cost + target markup</button>
</div>
<div class="row">
<div><label for="cost">Cost ($)</label><input id="cost" type="number" inputmode="decimal" min="0" step="any" value="8"></div>
<div id="f2"><label for="second" id="l2">Selling price ($)</label><input id="second" type="number" inputmode="decimal" min="0" step="any" value="10"></div>
</div>
<p class="msg" id="msg" role="status"></p>
<div class="out">
<div><span id="o1n">GP</span><b id="o1">–</b></div>
<div><span id="o2n">Margin</span><b id="o2">–</b></div>
<div><span id="o3n">Markup</span><b id="o3">–</b></div>
</div>
<p class="note">Margin is GP ÷ selling price. Markup is GP ÷ cost. A 25% markup equals a 20% margin.</p>
</section>

<section class="card">
<h2>Price list</h2>
<div class="tw">
<table>
<thead><tr><th>Product</th><th>Cost</th><th>Price</th><th class="r">GP</th><th class="r">Margin</th><th class="r">Markup</th><th></th></tr></thead>
<tbody id="rows"></tbody>
</table>
</div>
<button class="add" id="add">Add product</button>
</section>
</main>
<script>
var $=function(i){return document.getElementById(i)};
var mode="price";
function money(n){return isFinite(n)?(n<0?"-":"")+"$"+Math.abs(n).toFixed(2):"–"}
function pct(n){return isFinite(n)?n.toFixed(2)+"%":"–"}
function set(id,txt,neg){var e=$(id);e.textContent=txt;e.className=neg?"neg":""}
function calc(){
  var c=parseFloat($("cost").value),s=parseFloat($("second").value),msg="",price,gp,mg,mk;
  if(isNaN(c)||isNaN(s)){msg="Enter both numbers to see the result."}
  else if(mode==="price"){price=s}
  else if(mode==="margin"){ if(s>=100){msg="Margin must be below 100%."} else price=c/(1-s/100) }
  else {price=c*(1+s/100)}
  if(price!==undefined){gp=price-c;mg=price>0?gp/price*100:NaN;mk=c>0?gp/c*100:NaN}
  $("msg").textContent=msg;
  var priceMode=mode==="price";
  $("o1n").textContent="GP";
  if(price===undefined){["o1","o2","o3"].forEach(function(i){set(i,"–")});return}
  if(priceMode){
    $("o1n").textContent="GP";$("o2n").textContent="Margin";$("o3n").textContent="Markup";
    set("o1",money(gp),gp<0);set("o2",pct(mg),mg<0);set("o3",pct(mk),mk<0);
  } else {
    $("o1n").textContent="Selling price";$("o2n").textContent="GP";
    $("o3n").textContent=mode==="margin"?"Markup":"Margin";
    set("o1",money(price));set("o2",money(gp),gp<0);set("o3",pct(mode==="margin"?mk:mg));
  }
}
document.querySelectorAll(".tabs button").forEach(function(b){
  b.addEventListener("click",function(){
    mode=b.dataset.m;
    document.querySelectorAll(".tabs button").forEach(function(x){x.setAttribute("aria-pressed",x===b)});
    var l=$("l2"),i=$("second");
    if(mode==="price"){l.textContent="Selling price ($)";i.value="10"}
    else if(mode==="margin"){l.textContent="Target margin (%)";i.value="20"}
    else {l.textContent="Target markup (%)";i.value="25"}
    calc();
  });
});
$("cost").addEventListener("input",calc);$("second").addEventListener("input",calc);

function rowCalc(tr){
  var c=parseFloat(tr.querySelector(".c").value),p=parseFloat(tr.querySelector(".p").value);
  var o=tr.querySelectorAll(".o");
  if(isNaN(c)||isNaN(p)){o[0].textContent=o[1].textContent=o[2].textContent="–";return}
  var g=p-c;
  o[0].textContent=money(g);o[1].textContent=pct(p>0?g/p*100:NaN);o[2].textContent=pct(c>0?g/c*100:NaN);
  o.forEach(function(e){e.className="r o"+(g<0?" neg":"")});
}
function addRow(n,c,p){
  var tr=document.createElement("tr");
  tr.innerHTML='<td><input class="n" aria-label="Product name" placeholder="Product"></td>'+
  '<td><input class="c" type="number" inputmode="decimal" min="0" step="any" aria-label="Cost"></td>'+
  '<td><input class="p" type="number" inputmode="decimal" min="0" step="any" aria-label="Price"></td>'+
  '<td class="r o">–</td><td class="r o">–</td><td class="r o">–</td>'+
  '<td><button class="x" aria-label="Remove row">×</button></td>';
  tr.querySelector(".n").value=n||"";tr.querySelector(".c").value=c||"";tr.querySelector(".p").value=p||"";
  tr.addEventListener("input",function(){rowCalc(tr)});
  tr.querySelector(".x").addEventListener("click",function(){tr.remove()});
  $("rows").appendChild(tr);rowCalc(tr);
}
$("add").addEventListener("click",function(){addRow()});
addRow("Product A",8,10);addRow("Product B",4.5,6);addRow();
calc();
</script>
</body>
</html>
